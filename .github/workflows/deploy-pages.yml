name: Deploy KoskomTek to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Hent kildekoden
        uses: actions/checkout@v6

      - name: Sett opp Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Konfigurer GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Installer avhengigheter
        run: npm ci

      - name: Bygg statisk nettside
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - name: Last opp Pages-artefakt
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publiser på GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
